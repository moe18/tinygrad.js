# The Python half of tinygrad.js. It is normally embedded into the worker bundle by `npm run build`; this file lets it be
# built as a wheel too (`pip wheel . -w dist/`), e.g. to load it with micropip in a custom Pyodide setup.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tinygrad.js"
version = "0.1.0"
description = "Browser WebGPU device for upstream tinygrad, running in Pyodide"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["tinygrad>=0.12.0,<0.15"]

[tool.setuptools]
package-dir = { "" = "python" }
# tinygrad_js._shims.torch is the PyTorch-compatible API. It is only importable as `torch` after tinygrad_js.install_torch().
packages = ["tinygrad_js", "tinygrad_js._shims", "tinygrad_js._shims.torch", "tinygrad_js._shims.torch.autograd", "tinygrad_js._shims.torch.backends",
            "tinygrad_js._shims.torch.cuda", "tinygrad_js._shims.torch.nn", "tinygrad_js._shims.torch.nn.utils", "tinygrad_js._shims.torch.optim",
            "tinygrad_js._shims.torch.utils", "tinygrad_js._shims.torch.utils.data"]
